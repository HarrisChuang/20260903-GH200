name: Lab04 Deploy to Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# workflow 層級維持最小權限，需要更多權限的 job 再自行提升。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # 建立／更新 build-latest 這個 rolling pre-release 需要寫入 contents。
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error
          retention-days: 1

      - name: Publish jar to rolling pre-release build-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view build-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create build-latest \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "build-latest" \
              --notes "GH-200 lab 用的滾動式建置產出，由 workflow 自動更新。"
          fi
          gh release upload build-latest target/simpleweb.jar \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "已發佈：https://github.com/$GITHUB_REPOSITORY/releases/download/build-latest/simpleweb.jar"

  deploy-test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: test
      url: http://${{ vars.VM_PUBLIC_IP }}:8080/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy jar to VM and restart service
        env:
          # public repo 的 release asset 可匿名下載，因此不需要把任何 token 交給 VM。
          JAR_URL: https://github.com/${{ github.repository }}/releases/download/build-latest/simpleweb.jar
        run: |
          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --parameters "$JAR_URL" "test" "simpleweb-test" "${{ github.sha }}" \
            --scripts '
              set -euo pipefail
              JAR_URL="$1"; ENV_DIR="$2"; SERVICE="$3"; SHA="$4"
              STAGING="/opt/simpleweb/staging/$ENV_DIR"
              TARGET="/opt/simpleweb/$ENV_DIR"
              sudo mkdir -p "$STAGING" "$TARGET"
              sudo rm -f "$STAGING/simpleweb.jar"
              sudo curl -fsSL -o "$STAGING/simpleweb.jar" "$JAR_URL"
              sudo unzip -tq "$STAGING/simpleweb.jar"
              sudo install -m 0644 -o root -g root "$STAGING/simpleweb.jar" "$TARGET/simpleweb.jar"
              sudo touch "$TARGET/app.env"
              sudo sed -i "/^APP_BUILD_SHA=/d; /^APP_BUILD_TIME=/d" "$TARGET/app.env"
              printf "APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                | sudo tee -a "$TARGET/app.env" >/dev/null
              sudo chown root:root "$TARGET/app.env"
              sudo chmod 0644 "$TARGET/app.env"
              sudo systemctl restart "$SERVICE"
              sleep 5
              sudo systemctl is-active "$SERVICE"
            ' \
            --output table

      - name: Smoke test http://VM:8080
        run: |
          set -euo pipefail
          BASE="http://${{ vars.VM_PUBLIC_IP }}:8080"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "$BASE/actuator/health" >/dev/null; then
              echo "✅ 服務已啟動"
              curl -fsS "$BASE/api/info"
              echo ""
              exit 0
            fi
            echo "等待服務啟動中... ($i/12)"
            sleep 5
          done
          echo "❌ 服務在 60 秒內沒有回應"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lab04 部署到 test"
            echo ""
            echo "- Service: \`simpleweb-test\`"
            echo "- URL: http://${{ vars.VM_PUBLIC_IP }}:8080/"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Jar 來源: \`build-latest\` release asset（匿名下載，未傳遞任何 token）"
          } >> "$GITHUB_STEP_SUMMARY"
