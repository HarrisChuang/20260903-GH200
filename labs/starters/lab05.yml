name: Lab05 Promote to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # TODO 1: 把 Lab04 的 build job 原封不動搬過來
  #   （含 contents: write 與發佈 build-latest 的步驟）
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify
      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error
          retention-days: 1
      - name: Publish jar to rolling pre-release build-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view build-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create build-latest --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "build-latest" \
              --notes "GH-200 lab 用的滾動式建置產出。"
          fi
          gh release upload build-latest target/simpleweb.jar \
            --repo "$GITHUB_REPOSITORY" --clobber

