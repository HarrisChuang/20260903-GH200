# 06 - 完整流水線：Build → Test → Package → Deploy(test) → 核准 → Deploy(prod)
#
# 這支就是課程的終極目標：客戶希望學員上完課能自己寫出這樣一條流水線。
#
# 教學重點
#   - 一條 workflow 裡用 needs: 串出階段
#   - build once, deploy many：只 build 一次，兩個環境部署同一份產物
#   - 測試環境自動部署、正式環境要人工核准
#   - 每個階段都有驗證，不是丟出去就算完
name: 06.full-pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: build-latest

jobs:
  # ---------- 1. Build & Test ----------
  build:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Collect metadata
        id: meta
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload deployable jar
        uses: actions/upload-artifact@v4
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error

  # ---------- 2. Package ----------
  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: simpleweb-jar
          path: ./dist

      - name: Publish deployable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --prerelease --title "Rolling build" --notes "由 CI 自動更新的最新可部署版本"
          gh release upload "$RELEASE_TAG" ./dist/simpleweb.jar --clobber

  # ---------- 3. Deploy 到測試環境（自動） ----------
  deploy-test:
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: test
      url: http://${{ vars.VM_PUBLIC_IP }}:8080
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 共享課程訂閱可能有外部 auto-shutdown；部署前先確保 VM 正在執行。
      - name: Ensure VM is running
        run: |
          az vm start \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}"

      - name: Deploy
        env:
          JAR_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/build-latest/simpleweb.jar
        run: |
          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "
              set -eu
              curl -fsSL --retry 3 -o /tmp/simpleweb.jar '$JAR_URL'
              install -o simpleweb -g simpleweb -m 0644 /tmp/simpleweb.jar /opt/simpleweb/test/simpleweb.jar
              printf 'APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n' '${{ github.sha }}' \"\$(date -u +%FT%TZ)\" > /opt/simpleweb/test/app.env
              systemctl restart simpleweb-test
              sleep 5
              systemctl is-active simpleweb-test
            " \
            --query "value[0].message" -o tsv

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS "http://${{ vars.VM_PUBLIC_IP }}:8080/api/info" && exit 0
            echo "等待應用程式啟動... ($i/10)" && sleep 6
          done
          exit 1

  # ---------- 4. Deploy 到正式環境（需人工核准） ----------
  deploy-prod:
    runs-on: ubuntu-latest
    # 必須把 build 也列進 needs，否則 needs.build.outputs 讀不到值
    needs: [build, deploy-test]
    environment:
      name: production
      url: http://${{ vars.VM_PUBLIC_IP }}:8081
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 共享課程訂閱可能有外部 auto-shutdown；部署前先確保 VM 正在執行。
      - name: Ensure VM is running
        run: |
          az vm start \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}"

      - name: Deploy
        env:
          JAR_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/build-latest/simpleweb.jar
        run: |
          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "
              set -eu
              curl -fsSL --retry 3 -o /tmp/simpleweb.jar '$JAR_URL'
              install -o simpleweb -g simpleweb -m 0644 /tmp/simpleweb.jar /opt/simpleweb/prod/simpleweb.jar
              printf 'APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n' '${{ github.sha }}' \"\$(date -u +%FT%TZ)\" > /opt/simpleweb/prod/app.env
              systemctl restart simpleweb-prod
              sleep 5
              systemctl is-active simpleweb-prod
            " \
            --query "value[0].message" -o tsv

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS "http://${{ vars.VM_PUBLIC_IP }}:8081/api/info" && exit 0
            echo "等待應用程式啟動... ($i/10)" && sleep 6
          done
          exit 1

      - name: Write job summary
        run: |
          {
            echo "## 部署完成"
            echo ""
            echo "| 環境 | 網址 |"
            echo "| --- | --- |"
            echo "| test | http://${{ vars.VM_PUBLIC_IP }}:8080 |"
            echo "| production | http://${{ vars.VM_PUBLIC_IP }}:8081 |"
            echo ""
            echo "版本：\`${{ needs.build.outputs.sha_short }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

